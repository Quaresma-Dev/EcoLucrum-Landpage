    <button class="dialog-close" type="button" aria-label="Fechar exemplo">×</button>

    <span class="eyebrow" id="dialog-eyebrow">Demonstração dos EcoPontos</span>
    <h2 id="dialog-title"></h2><p id="dialog-copy"></p>
    <div id="dialog-checkout"><div class="dialog-points"><svg><use href="#i-coin"/></svg><strong id="dialog-cost"></strong><span>EcoPontos ilustrativos</span><span class="dialog-balance" id="dialog-balance"></span></div><p id="dialog-availability" class="dialog-availability"></p><button type="button" id="confirm-redeem" class="button button-primary">Simular resgate <svg><use href="#i-arrow"/></svg></button><button type="button" class="feedback-text-button dialog-missions" id="dialog-missions">Voltar para as missões</button></div>
